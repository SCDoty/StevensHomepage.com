<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny 2 Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="destiny.css">
</head>
<body>
    <div id="bg"></div>

    <nav id="topbar">
        <a id="d2-back" href="index.html">‹ Home</a>
        <div id="brand">Destiny 2 <span>// Build Hub</span></div>
        <div id="class-tabs"></div>
    </nav>

    <main>
        <section id="hero">
            <div id="subclass-tabs"></div>
            <div id="hero-kicker"></div>
            <h1 id="hero-title"></h1>

            <div id="mode-tabs"></div>
            <div id="hero-controls">
                <div id="build-tabs"></div>
                <div id="raid-tabs" title="Swap raid-only gear for gear you can farm elsewhere"></div>
            </div>
        </section>

        <section id="build-detail"></section>

        <footer id="resources">
            <h3 class="panel-title">Resources</h3>
            <div id="resource-links">
                <a href="https://www.light.gg" target="_blank">light.gg</a>
                <a href="https://d2foundry.gg" target="_blank">D2 Foundry</a>
                <a href="https://app.destinyitemmanager.com" target="_blank">DIM</a>
                <a href="https://mobalytics.gg/destiny-2/builds" target="_blank">Mobalytics Builds</a>
                <a href="https://www.bungie.net/7/en/News" target="_blank">Bungie News</a>
            </div>
            <p id="d2-note">Icons, perk text and sources come from the Bungie API. Picks are long-standing staples rather than a live meta feed, and champion counters follow the current seasonal artifact.</p>
        </footer>
    </main>

    <script src="destiny-custom-data.js"></script>
    <script src="destiny-custom.js"></script>
    <script src="destiny.js"></script>
</body>
</html>
