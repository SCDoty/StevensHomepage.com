<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny 2 Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="destiny.css">
</head>
<body>

    <div id="d2-header">
        <a id="d2-back" href="index.html">← Home</a>
        <h1>Destiny 2 Hub</h1>
    </div>

    <div class="section-label">Class</div>
    <div id="class-tabs" class="d2-tabs"></div>

    <div class="section-label">Subclass</div>
    <div id="subclass-tabs" class="d2-tabs"></div>

    <div class="section-label">Build</div>
    <div id="build-tabs" class="d2-tabs"></div>

    <div id="build-detail"></div>

    <div class="section-label">Resources</div>
    <div id="card-grid">
        <a class="site-card" href="https://www.light.gg" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=light.gg&sz=48" alt="">
            <span>light.gg</span>
        </a>
        <a class="site-card" href="https://d2foundry.gg" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=d2foundry.gg&sz=48" alt="">
            <span>D2 Foundry</span>
        </a>
        <a class="site-card" href="https://app.destinyitemmanager.com" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=destinyitemmanager.com&sz=48" alt="">
            <span>DIM</span>
        </a>
        <a class="site-card" href="https://mobalytics.gg/destiny-2/builds" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=mobalytics.gg&sz=48" alt="">
            <span>Mobalytics Builds</span>
        </a>
        <a class="site-card" href="https://www.bungie.net/7/en/News" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=bungie.net&sz=48" alt="">
            <span>Bungie News</span>
        </a>
    </div>

    <p id="d2-note">Picks are long-standing staples, not a live meta feed. Balance changes each season, so check light.gg or D2 Foundry before farming anything.</p>

    <script src="destiny.js"></script>
</body>
</html>
